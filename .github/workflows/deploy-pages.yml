name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'api/src/**'
      - 'functions/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'wrangler.toml'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck backend
        working-directory: api
        run: bun run build

      - name: Build frontend
        run: bun run build

      # Cloudflare Pages deployment removed - user deploys manually with wrangler
